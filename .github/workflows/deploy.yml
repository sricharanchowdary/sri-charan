name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Cloudflare Workers
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check Astro project
        run: npm run check

      - name: Run unit & integration tests
        run: npm run test:coverage

      - name: Build site
        run: npm run build

      - name: Deploy with Wrangler (retry on transient failures)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -uo pipefail

          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN secret is not configured in GitHub repository secrets. Please add it under Repository Settings > Secrets and variables > Actions."
            exit 1
          fi

          echo "Cloudflare Wrangler version:"
          npx wrangler --version

          max_attempts=3
          for attempt in $(seq 1 $max_attempts); do
            echo "=== Deploy attempt $attempt of $max_attempts ==="
            if npx wrangler deploy; then
              echo "✅ Deployment succeeded on attempt $attempt"
              exit 0
            else
              echo "⚠️ Deploy failed on attempt $attempt"
              if [ "$attempt" -lt "$max_attempts" ]; then
                sleep_time=$((attempt * 10))
                echo "Sleeping $sleep_time seconds before retry..."
                sleep $sleep_time
              else
                echo "❌ All $max_attempts deploy attempts failed."
                exit 1
              fi
            fi
          done
